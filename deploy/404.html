<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbfaf7;
            color: #191b1f;
            font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.65;
            text-align: center;
        }

        main {
            padding: 2rem;

        .code {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.04em;

        p {

            color: #5b5f66;
        }

        ul {

            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        a {
            display: inline-block;
            padding: 0.55rem 1.1rem;
            border: 1px solid #ded9ce;
            border-radius: 4px;
            color: #1c4a7a;
            text-decoration: none;
            font-size: 0.95rem;
        }

        a:hover {
            border-color: #1c4a7a;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #14161a;
                color: #eae7e1;
            }

            .code {
                color: #2e333b;
            }

            p {
