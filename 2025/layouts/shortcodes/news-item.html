<a href="{{ .Get "link" }}" class="list-group-item list-group-item-action">
    <div class="d-flex w-100 justify-content-between">
        <h5 class="mb-1">{{ .Get "title" | safeHTML }}</h5>
        <small>Date: {{ .Get "date" }}</small>
    </div>
    <p class="mb-1 px-2">{{ .Get "description" | safeHTML }}</p>
</a>
