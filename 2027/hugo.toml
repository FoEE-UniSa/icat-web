baseURL = "https://icat.etf.unsa.ba/2027/"
title = "ICAT 2027"
copyright = "© 2027 ICAT Conference Committee"

# No category/tag pages, no RSS feed.
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "31st International Conference on Information, Communication and Automation Technologies. 13–15 October 2027, Sarajevo, Bosnia and Herzegovina."
  dates = "13–15 October 2027"
  city = "Sarajevo, Bosnia and Herzegovina"
  email = "icat@etf.unsa.ba"
  # Flip to true when the registration form goes live; it unhides the navbar button.
  registrationOpen = false

# Flat output: content/foo.md → /2027/foo.html
[permalinks.page]
  "/**" = "/:contentbasename.html"

[taxonomies]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
