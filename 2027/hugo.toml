baseURL = "https://icat.etf.unsa.ba/2027/"
title = "ICAT 2027"
copyright = "© 2027 ICAT Conference Committee"

# No category/tag pages, no RSS feed.
disableKinds = ["taxonomy", "term", "RSS"]

# How many items of each kind the home page shows.
[params.home]
  keynotes = 3
  news = 5
  deadlines = 6

# Flat output: content/foo.md → /2027/foo.html
# Pages inside a content section keep the section in the path:
# content/keynotes/foo.md → /2027/keynotes/foo.html
[permalinks.page]
  "/**" = "/:sections/:contentbasename.html"

[taxonomies]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = true
