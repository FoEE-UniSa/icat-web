<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="Hugo">

    <title>{{ if .IsHome }}{{ .Site.Title }} · {{ .Site.Params.dates }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{- /* Hugo appends a trailing slash to file-style permalinks; strip it. */ -}}
    {{ $canonical := .Permalink }}{{ if not .IsHome }}{{ $canonical = strings.TrimSuffix "/" .Permalink }}{{ end }}
    <link rel="canonical" href="{{ $canonical }}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:url" content="{{ $canonical }}">
    <meta property="og:image" content="{{ strings.TrimSuffix "/" .Site.BaseURL }}/images/sarajevo.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="theme-color" content="#17191d">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap/css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/icat-2027.css" rel="stylesheet">

    <script>
        // Apply theme and mark JS as available before first paint.
        (function () {
            document.documentElement.classList.add('js');
            var t = localStorage.getItem('icat-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
</head>

<body>
    {{ partial "navbar.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/icat-2027.js"></script>
</body>

</html>
