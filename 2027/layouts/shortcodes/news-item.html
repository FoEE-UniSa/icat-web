<a href="{{ .Get "link" }}" class="list-group-item list-group-item-action py-3">
<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-baseline gap-1 mb-1">
<h5 class="mb-0">{{ .Get "title" | safeHTML }}</h5>
<small class="icat-news-date text-nowrap"><i class="bi bi-calendar3"></i>{{ .Get "date" }}</small>
</div>
{{ if .Get "description" }}<p class="mb-0">{{ .Get "description" | safeHTML }}</p>{{ end }}
</a>
