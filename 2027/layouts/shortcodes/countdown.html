<div id="icat-countdown" class="icat-countdown" data-countdown="{{ .Get "target" | default "2027-10-13T09:00:00+02:00" }}">
    <div class="icat-countdown-unit">
        <div class="number">--</div>
        <div class="label">Days</div>
    </div>
    <div class="icat-countdown-unit">
        <div class="number">--</div>
        <div class="label">Hours</div>
    </div>
    <div class="icat-countdown-unit">
        <div class="number">--</div>
        <div class="label">Minutes</div>
    </div>
    <div class="icat-countdown-unit">
        <div class="number">--</div>
        <div class="label">Seconds</div>
    </div>
</div>
