{{ $label := .Get "label" }}
{{ $date := .Get "date" }}
{{ $variant := .Get "variant" | default "primary" }}
{{ $note := .Get "note" }}
<div class="icat-date-card {{ $variant }}">
<div class="d-flex justify-content-between align-items-baseline flex-wrap gap-2">
<span class="icat-date-label">{{ $label }}</span>
<span class="icat-date-when">{{ $date }}</span>
</div>
{{ if $note }}<div class="small mt-1">{{ $note | safeHTML }}</div>{{ end }}
{{ if .Inner }}<div class="small mt-1">{{ .Inner }}</div>{{ end }}
</div>
